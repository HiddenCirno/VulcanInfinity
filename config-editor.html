<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>火神重工-无限 配置编辑器</title>
  <style>
    body { font-family: sans-serif; background: #f8f8f8; }
    .desc { color: #888; font-size: 0.9em; margin-left: 1em; }
    .section { border: 1px solid #ccc; background: #fff; margin: 1em 0; padding: 1em; border-radius: 8px; }
    .key { font-weight: bold; }
    .array-input { width: 80%; }
    .switch { width: 40px; height: 20px; }
    label { display: flex; align-items: center; margin: 0.5em 0; }
    input[type="text"], input[type="number"] { padding: 2px 6px; border-radius: 4px; border: 1px solid #ccc; }
    .object-key { margin-top: 1em; font-size: 1.1em; color: #333; }
    .editor-controls { margin-bottom: 1em; }
    .preset-controls { margin-top: 1em; }
    .comment { color: #aaa; font-size: 0.85em; margin-left: 1em; }
    .array-item { display: flex; align-items: center; margin-bottom: 0.2em; }
    .array-item input { margin-right: 0.5em; }
    .array-actions button { margin-left: 0.5em; }
    .json-error { color: red; font-size: 0.95em; }
  </style>
</head>
<body>
  <h1>火神重工-无限 配置编辑器</h1>
  <div class="editor-controls">
    <input type="file" id="fileInput" accept=".json">
    <button onclick="downloadConfig()">保存配置</button>
    <button onclick="downloadPreset()">导出为预设</button>
    <input type="file" id="presetInput" accept=".json">
  </div>
  <div id="editor"></div>
  <div id="jsonError" class="json-error"></div>
  <script src="config-editor.js"></script>
</body>
</html>
